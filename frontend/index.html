<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ágora Colombia — Barómetro Presidencial & Inteligencia Ciudadana con IA</title>

  <!-- Google Fonts: Plus Jakarta Sans, Outfit, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS 3.4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pitch: '#030712',
            carbon: '#0B132B',
            surface: '#0F172A',
            surfaceElevated: '#1E293B',
            emeraldNeon: '#10B981',
            emeraldGlow: '#00F59B',
            cyanNeon: '#06B6D4',
            cyanGlow: '#00D2FF',
            amberNeon: '#F59E0B',
            crimsonNeon: '#EF4444',
            slateCool: '#94A3B8'
          },
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          },
          boxShadow: {
            'glow-emerald': '0 0 20px -5px rgba(16, 185, 129, 0.35)',
            'glow-cyan': '0 0 20px -5px rgba(6, 182, 212, 0.35)',
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone para JSX nativo en navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Canvas Confetti para Microinteracciones de Delight -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Estilos artesanales Impeccable (Craft Floor) -->
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      background: radial-gradient(ellipse at 50% -10%, #0c1a30 0%, #030712 100%), #030712;
      min-height: 100vh;
      overflow-x: hidden;
      selection-background-color: #10B981;
      selection-color: #030712;
    }
    ::selection {
      background-color: #10B981;
      color: #030712;
    }
    .glass-surface {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-surface-elevated {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(3, 7, 18, 0.6);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.5);
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    .animate-pulse-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="text-slate-100 font-sans antialiased selection:bg-emeraldNeon selection:text-pitch">

  <!-- Contenedor Raíz de React -->
  <div id="root">
    <div class="h-screen w-screen flex flex-col items-center justify-center bg-pitch text-slate-400 font-sans">
      <div class="w-12 h-12 rounded-2xl bg-emeraldNeon/10 border border-emeraldNeon/30 flex items-center justify-center text-2xl animate-pulse mb-4">
        🇨🇴
      </div>
      <p class="font-outfit text-lg font-bold text-white">Inicializando Ágora Colombia</p>
      <p class="text-xs text-slate-500 font-inter mt-1">Cargando aplicación React & Barómetro de Inteligencia Ciudadana...</p>
    </div>
  </div>

  <!-- Aplicación React 18 con JSX -->
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
