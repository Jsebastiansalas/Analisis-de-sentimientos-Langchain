version: '3.8'

services:
  # Servicio 1: Frontend Moderno SPA (FastAPI + HTML5 + Tailwind CSS + Chart.js)
  agora_web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora_colombia_web
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./datos:/app/datos
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/politicos || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Servicio 2: Chatbot y Tablero de Control Académico en Streamlit
  agora_streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora_colombia_streamlit
    command: ["streamlit", "run", "app.py"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./datos:/app/datos
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
